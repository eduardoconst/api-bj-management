spring:
  application:
    name: api-bj-management

  datasource:
    url: jdbc:h2:mem:bjdb
    driver-class-name: org.h2.Driver
    username: bj
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console